[project]
name = "base64-tool"
version = "0.1.0"
description = "A command-line Base64 encoder and decoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
base64-tool = "base64_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
